preprocess:
  - yue2_processor:
      name: "yue2_processor"
      cwd: "/root/apps/YuE"
      environment: "/root/autodl-tmp/envs/yue-model"
      task_root: "/root/agent-sandbox-data/tasks"
      model_path: "/root/checkpoint/YuE2-3B"
      vae_path: "/root/checkpoint/YuE2-Vae"
      offline: true
      device: "cuda"
      memory_budget_gib: 24
      timeout_seconds: 7200
  - sheetsage2_processor:
      name: "sheetsage2_processor"
      cwd: "/root/apps/YuE"
      environment: "/root/autodl-tmp/envs/sheetsage2"
      task_root: "/root/agent-sandbox-data/tasks"
      model_path: "/root/checkpoint/SheetSage2"
      base_model_path: "/root/checkpoint/MERT-v2-FullSong"
      offline: true
      device: "cuda"
      dtype: "bf16"
      preset: "default"
      threads: 4
      timeout_seconds: 7200

tasks:
  - yue2_task:
      name: "yue2_task"
      preprocess:
        - yue2:
            processor: "yue2_processor"
            processor_name: "YuE2"
  - sheetsage2_task:
      name: "sheetsage2_task"
      preprocess:
        - sheetsage2:
            processor: "sheetsage2_processor"
            processor_name: "SheetSage2"

bootstrap:
  - runner_bootstrap_web:
      name: "runner_bootstrap_web"
      host: "127.0.0.1"
      port: 10000
      max_ongoing_tasks: 1
      web_client_timeout: 18000
      finished_task_remove_timeout: 10000
      music:
        data_root: "/root/agent-sandbox-data"
        auth_required: false
        principal: "local"
        retention_seconds: 604800
      upload:
        data_root: "/root/agent-sandbox-data"
        max_input_bytes: 268435456
      mcp:
        enabled: true
        path: "/mcp"
        transport: "streamable-http"
        public_base_url: "http://127.0.0.1:11000"
        dns_rebinding_protection: false
        tools:
          - "runner_upload"
          - "runner_submit"
          - "runner_result"
          - "runner_result_source"
        upload_capability_path: "/api/uploads/{token}"
        upload_ttl_seconds: 300
        max_request_bytes: 1048576
        inline_max_bytes: 262144
