preprocess:
    - sandbox_started_processor:
          name: "sandbox_started_processor"
          cwd: "/Users/dmeck/sandbox"
    - agent_mem0_processor:
          name: "agent_mem0_processor"
          cwd: "/Users/dmeck/sandbox"
    - agent_workspace_l2_processor:
          name: "agent_workspace_l2_processor"
          cwd: "/Users/dmeck/sandbox"
    - agent_workspace_l3_processor:
          name: "agent_workspace_l3_processor"
          cwd: "/Users/dmeck/sandbox"

tasks:
  - sandbox_eval_task:
      name: "sandbox_eval_task"
      preprocess:
        - sandbox_started_processor:
            processor: "sandbox_started_processor"
            processor_name: "Sandbox"
  - agent_mem0_task:
      name: "agent_mem0_task"
      preprocess:
        - mem0:
            processor: "agent_mem0_processor"
            processor_name: "AgentMem0"
  - agent_workspace_l2_task:
      name: "agent_workspace_l2_task"
      preprocess:
        - l2:
            processor: "agent_workspace_l2_processor"
            processor_name: "AgentWorkspaceL2"
  - agent_workspace_l3_task:
      name: "agent_workspace_l3_task"
      preprocess:
        - l3:
            processor: "agent_workspace_l3_processor"
            processor_name: "AgentWorkspaceL3"


bootstrap:
  - runner_bootstrap_web:
      name: "runner_bootstrap_web"
      host: "0.0.0.0"
      port: 10000
      max_ongoing_tasks: 10
      web_client_timeout: 1800
      finished_task_remove_timeout: 100

