preprocess:
    - sandbox_started_processor:
          name: "sandbox_started_processor"
          cwd: "/Users/dmeck/project/agent-sandbox/app/sandbox"
    - research_agent_processor:
          name: "research_agent_processor"
          cwd: "/Users/dmeck/project/agent-sandbox/app/sandbox"
          # prompts:
          #   lead_agent: "/app/research_agent/prompts/lead_agent_sql.txt"
          #   researcher: "/app/research_agent/prompts/researcher_sql.txt"
          #   data_analyst: "/app/research_agent/prompts/data_analyst_sql.txt"
          #   report_writer: "/app/research_agent/prompts/report_writer.txt"
    - agent_mem0_processor:
          name: "agent_mem0_processor"
          cwd: "/Users/dmeck/project/agent-sandbox/app/sandbox"
    - agent_workspace_l2_processor:
          name: "agent_workspace_l2_processor"
          cwd: "/Users/dmeck/project/agent-sandbox/app/sandbox"
    - agent_workspace_l3_processor:
          name: "agent_workspace_l3_processor"
          cwd: "/Users/dmeck/project/agent-sandbox/app/sandbox"
    - yue2_processor:
          name: "yue2_processor"
          cwd: "/root/apps/YuE"
          environment: "/root/yue-env"
          task_root: "/root/agent-sandbox-data/tasks"
          model_path: "/root/checkpoint/YuE2-3B"
          vae_path: "/root/checkpoint/YuE2-Vae"
          offline: true
          device: "cuda"
          memory_budget_gib: 24
          timeout_seconds: 7200
    - sheetsage2_processor:
          name: "sheetsage2_processor"
          cwd: "/root/apps/YuE"
          environment: "/root/sheetsage2-env"
          task_root: "/root/agent-sandbox-data/tasks"
          model_path: "/root/checkpoint/SheetSage2"
          base_model_path: "/root/checkpoint/MERT-v2-FullSong"
          offline: true
          device: "cuda"
          dtype: "bf16"
          preset: "default"
          threads: 4
          timeout_seconds: 7200

tasks:
  - sandbox_eval_task:
      name: "sandbox_eval_task"
      preprocess:
        - sandbox_started_processor:
            processor: "sandbox_started_processor"
            processor_name: "Sandbox"
  - research_agent_task:
      name: "research_agent_task"
      preprocess:
        - research_agent_processor:
            processor: "research_agent_processor"
            processor_name: "ResearchAgentSandbox"
  - agent_mem0_task:
      name: "agent_mem0_task"
      preprocess:
        - mem0:
            processor: "agent_mem0_processor"
            processor_name: "AgentMem0"
  - agent_workspace_l2_task:
      name: "agent_workspace_l2_task"
      preprocess:
        - l2:
            processor: "agent_workspace_l2_processor"
            processor_name: "AgentWorkspaceL2"
  - agent_workspace_l3_task:
      name: "agent_workspace_l3_task"
      preprocess:
        - l3:
            processor: "agent_workspace_l3_processor"
            processor_name: "AgentWorkspaceL3"
  - yue2_task:
      name: "yue2_task"
      preprocess:
        - yue2:
            processor: "yue2_processor"
            processor_name: "YuE2"
  - sheetsage2_task:
      name: "sheetsage2_task"
      preprocess:
        - sheetsage2:
            processor: "sheetsage2_processor"
            processor_name: "SheetSage2"


bootstrap:
  - runner_bootstrap_web:
      name: "runner_bootstrap_web"
      host: "0.0.0.0"
      port: 10000
      max_ongoing_tasks: 1
      web_client_timeout: 18000
      finished_task_remove_timeout: 10000
      music:
        data_root: "/root/agent-sandbox-data"
        api_keys_file: "/root/agent-sandbox-data/secrets/music-api-keys.json"
        auth_required: true
        retention_seconds: 604800
      upload:
        data_root: "/root/agent-sandbox-data"
        max_input_bytes: 268435456
      mcp:
        enabled: false
        path: "/mcp"
        transport: "streamable-http"
        public_base_url: "https://runner.example.invalid"
        tools:
          - "runner_upload"
          - "runner_submit"
          - "runner_result"
          - "runner_result_source"
        upload_capability_path: "/api/uploads/{token}"
        upload_ttl_seconds: 300
        max_request_bytes: 1048576
        inline_max_bytes: 262144
